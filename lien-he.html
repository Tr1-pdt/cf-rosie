    <main class="content" role="main">
      <h1>Liên hệ với chúng tôi</h1>
      <p>Chúng tôi rất vui được nghe phản hồi từ bạn! Vui lòng sử dụng các thông tin bên dưới để liên hệ.</p>

      <section>
        <h2>Địa chỉ</h2>
        <p>📍123 Đường Hồng Hoa, Quận Cà Phê, TP. Hồ Chí Minh</p>
      </section>

      <section>
        <h2>Điện thoại</h2>
        <p>📞<a href="tel:0909999999">0909 999 999</a></p>
      </section>

      <section>
        <h2>Email</h2>
        <p>📧<a href="mailto:info@honghoa.vn">info@honghoa.vn</a></p>
      </section>

      <section>
        <h2>Gửi phản hồi</h2>
        <form>
          <label for="name">Họ tên:</label><br />
          <input type="text" id="name" name="name" required /><br /><br />
          <label for="email">Email:</label><br />
          <input type="email" id="email" name="email" required /><br /><br />
          <label for="message">Nội dung:</label><br />
          <textarea id="message" name="message" rows="5" required></textarea><br /><br />
          <button type="submit" class="details-button">Gửi</button>
        </form>
      </section>
    </main>
